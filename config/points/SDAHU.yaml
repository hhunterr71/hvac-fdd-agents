# Reference Mapping for SDAHU: the answer key for the tagging agent.
# Drafted by Claude from the LBNL point descriptions (data/lbnl/docs/, LBNL_FDD_Data_Sets_SDAHU.pdf Table 2);
# spot-check before relying on it. Tags use flat Project Haystack style.
# The tagging agent never sees this file; it works from raw names and data only.
system: SDAHU
timestamp: {column: "Datetime", format: "%Y-%m-%d %H:%M:%S"}
units:
  AHU-1: {type: ahu}
  VAV-1: {type: vav, ahuRef: AHU-1}
  VAV-2: {type: vav, ahuRef: AHU-1}
  VAV-3: {type: vav, ahuRef: AHU-1}
  VAV-4: {type: vav, ahuRef: AHU-1}
  VAV-5: {type: vav, ahuRef: AHU-1}

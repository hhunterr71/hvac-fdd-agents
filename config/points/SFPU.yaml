# Reference Mapping for SFPU: the answer key for the tagging agent.
# Drafted by Claude from the LBNL point descriptions (data/lbnl/docs/LBNL_FDD_Data_Sets_FPU.pdf,
# Table 1); spot-check before relying on it. Tags use flat Project Haystack style.
# The tagging agent never sees desc/units; it works from raw names and data only.
system: SFPU
timestamp: {column: "Datetime", format: "%m/%d/%Y %H:%M"}
units:
  AHU-1: {type: ahu}
  VAV-I: {type: vav-series, ahuRef: AHU-1}
  VAV-W: {type: vav-series, ahuRef: AHU-1}
  VAV-S: {type: vav-series, ahuRef: AHU-1}
  VAV-E: {type: vav-series, ahuRef: AHU-1}

# Ground truth for every LBNL case. Only the scorer may read this file.
# Generated from benchmark/ground_truth/catalog.csv by apply_catalog.py; edit the catalog, not this.
# unit/component/mode/severity: what failed and how. twin: fault-free file to compare against.
# twin_aligned: false means fault and twin cover different dates, so only case-level scoring applies.

cases:
  - case: PFPU/pfpu__fault_free.csv
    system: PFPU
    fault_free: true
    original_file: "PFPU_FaultFree.csv"
    source: "LBNL_FDD_Data_Sets_FPU.pdf Table 3"
  - case: PFPU/pfpu__zone_temp_control_unstable.csv
    system: PFPU
    fault_free: false
    unit: VAV-S
    component: zone_temp_control
    mode: unstable
    severity: null
    twin: PFPU/pfpu__fault_free.csv
    twin_aligned: true
    original_file: "PFPU_RMTEMPUnstable.csv"
    source: "LBNL_FDD_Data_Sets_FPU.pdf Table 3; zone from find_faulted_zones.py"
    note: "LBNL inventory says zone W; data shows the fault in this zone."
  - case: PFPU/pfpu__reheat_coil_fouling_airside__minor.csv
    system: PFPU
    fault_free: false
    unit: VAV-S

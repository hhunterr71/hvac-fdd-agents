[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-fdd-agents"
version = "0.1.0"
description = "Multi-agent facilities assistant: Haystack tagging, fault detection, and work orders from BMS trend data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13,<2",
    "duckdb>=1.5,<2",
    "langgraph>=1.2,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff"]
# Fault rules (phases 2-4). open-fdd is alpha, so it's pinned to the tested version; it
# uses numpy and pandas without declaring them, so they're listed here.
fdd = ["open-fdd==4.4.9", "numpy", "pandas"]
# The dashboard (dashboard/app.py). Altair comes with Streamlit.
app = ["streamlit>=1.66,<2"]

[project.scripts]
hvac-fdd-agents = "hvac_fdd_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pyflakes (unused imports, undefined names) and import sorting. Run: ruff check --fix
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["hvac_fdd_agents", "dashboard"]
